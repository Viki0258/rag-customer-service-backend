services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: whatsapp_support
      POSTGRES_USER: whatsapp_support
      POSTGRES_PASSWORD: whatsapp_support
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp_support -d whatsapp_support"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
